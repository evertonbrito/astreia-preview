<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layered plate pilot</title>
<style>
  html, body { margin: 0; background: #080a09; color: #e9e7dc; font: 12px/1.4 HelveticaNow, Helvetica, Arial, sans-serif; }
  #track { height: 400svh; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100svh; display: block; }
  #v { pointer-events: none; }
  #hud { position: fixed; left: 16px; bottom: 16px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; pointer-events: none; }
  #hud b { color: #f2632a; font-weight: 500; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="v"></canvas>
<div id="hud"><b>Pilot</b> · layered plate · <span id="t">t 1.600</span></div>
<div id="track"></div>
<script type="module">
// Relight compositor pilot: Cycles light groups (linear, additive) mixed per
// scroll position, ACES + the same +0.737 EV as the sequence renders, depth-
// driven parallax, drifting sky and heat shimmer once the engines light.
const base = new URL('./pad-t1.60/', location.href);
const meta = await (await fetch(new URL('plate.json', base))).json();
const cv = document.getElementById('c'), gl = cv.getContext('webgl2', { premultipliedAlpha: false });
const load = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = new URL(src, base); });
const names = ['sun', 'sky', 'engine', 'site', 'depth'];
const imgs = await Promise.all(names.map(n => load(n === 'depth' ? 'depth.png' : n + '.webp')));
const tex = imgs.map((im, k) => {
  const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + k); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
});
const vs = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0, 1); }`;
const fs = `#version 300 es
precision highp float; in vec2 uv; out vec4 o;
uniform sampler2D sun, sky, eng, site, depth;
uniform vec4 w;        // sun, sky, engine, site weights
uniform vec2 cover;    // viewport → plate scale (cover fit inside the overscan)
uniform vec2 pan;      // camera pan in plate units
uniform float time, heat, exposure;
vec3 dec(vec3 e){ vec3 r = pow(e, vec3(2.2)); return r / max(1. - r, 1e-3); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
void main(){
  vec2 q = (uv - .5) * cover + .5;
  float d = texture(depth, q).r;                       // 0 near … 1 sky
  vec2 par = pan * mix(1.35, .25, d);                  // near layers move more than far ones
  vec2 s = q + par;
  // Heat shimmer above the pad, where the engine light lands, once ignition starts.
  float lift = dot(dec(texture(eng, s).rgb), vec3(.3)) ;
  float sh = heat * clamp(lift * .6, 0., 1.) * (1. - d);
  s += sh * .004 * vec2(noise(s * 60. + time * 3.) - .5, noise(s * 60. - time * 2.4) - .5);
  vec3 c = w.x * dec(texture(sun, s).rgb) + w.w * dec(texture(site, s).rgb);
  // Sky: clouds drift slowly; only where nothing stands in front of them.
  vec2 ss = s + vec2(time * .0015 * smoothstep(.985, 1., d), 0.);
  c += w.y * dec(texture(sky, ss).rgb);
  float flick = .86 + .14 * noise(vec2(time * 18., 1.7)) + .06 * sin(time * 47.);
  c += w.z * flick * dec(texture(eng, s).rgb) * vec3(1., .93, .85);
  o = vec4(pow(aces(c * exposure), vec3(1. / 2.2)), 1.);
}`;
const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
const pg = gl.createProgram(); gl.attachShader(pg, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pg, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pg); gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pg, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
['sun', 'sky', 'eng', 'site', 'depth'].forEach((n, k) => gl.uniform1i(gl.getUniformLocation(pg, n), k));
const U = n => gl.getUniformLocation(pg, n);
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const OVER = 1.2, t0 = performance.now();
// Moving layer: vehicle, strongback and launch FX rendered from the plate's fixed
// camera on a transparent film (render-hero-sequence.py --vehicle). Frames load in
// the background; the nearest loaded frame is drawn with the plate's own crop.
const vc = document.getElementById('v'), vx = vc.getContext('2d');
let vmeta = null; const vimg = new Map();
fetch(new URL('vehicle/vehicle.json', base)).then(r => r.ok ? r.json() : null).then(m => {
  if (!m) return; vmeta = m;
  for (const f of m.frames) { const i = new Image(); i.decoding = 'async'; i.onload = () => vimg.set(f, i); i.src = new URL(`vehicle/v${String(f).padStart(3, '0')}.webp`, base); }
}).catch(() => {});
function drawVehicle(t, cover, pan, W, H) {
  if (vc.width !== W || vc.height !== H) { vc.width = W; vc.height = H; }
  vx.clearRect(0, 0, W, H);
  if (!vmeta || !vimg.size) return;
  const want = vmeta.f0 + (t - vmeta.t0) / vmeta.step;
  let best = null, bd = 1e9;
  for (const [f, im] of vimg) { const d = Math.abs(f - want); if (d < bd) { bd = d; best = im; } }
  if (!best || bd > 6) return;
  const iw = best.naturalWidth, ih = best.naturalHeight, k = .8;   // mid-depth parallax, as the pad around the stack
  const sx = (.5 - cover[0] / 2 + pan[0] * k) * iw, sy = (.5 - cover[1] / 2 + pan[1] * k) * ih;
  vx.drawImage(best, sx, sy, cover[0] * iw, cover[1] * ih, 0, 0, W, H);
}
let tStory = 1.6, shown = 1.6;
addEventListener('scroll', () => { const max = document.documentElement.scrollHeight - innerHeight; tStory = 1.6 + .45 * (max > 0 ? scrollY / max : 0); }, { passive: true });
function frame(now) {
  const dpr = Math.min(devicePixelRatio, 2), W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; gl.viewport(0, 0, W, H); }
  shown += (tStory - shown) * .12;                       // gentle scroll smoothing
  const t = shown, thrust = smooth(1.6, 1.72, t);
  const lift = smooth(1.62, 2.7, t), climb = lift * lift * 2400;
  // Cover-fit the plate (meta aspect) into the viewport, inside the overscan margin.
  const pa = meta.width / meta.height, va = W / H;
  const cover = va > pa ? [1 / OVER, pa / va / OVER] : [va / pa / OVER, 1 / OVER];
  gl.uniform2f(U('cover'), cover[0], cover[1]);
  // The camera rises with the climb (section3_camera: .7 · climb): pan within the margin.
  const room = (1 - cover[1]) / 2;
  const pan = [0, -room * Math.min(1, climb / 120) * .9];
  gl.uniform2f(U('pan'), pan[0], pan[1]);
  drawVehicle(t, cover, pan, W, H);
  gl.uniform4f(U('w'), 1 - .35 * thrust, 1, 3.2 * thrust, 1 - .5 * thrust);
  gl.uniform1f(U('time'), (now - t0) / 1000); gl.uniform1f(U('heat'), thrust);
  gl.uniform1f(U('exposure'), 2 ** meta.exposure_ev);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  document.getElementById('t').textContent = 't ' + t.toFixed(3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
